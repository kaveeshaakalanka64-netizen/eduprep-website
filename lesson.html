<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — EduPrep Sri Lanka</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand"><div class="brand-mark">EP</div>EduPrep</a>
    <nav class="topnav">
      <a href="index.html">Subjects</a>
      <a href="index.html#how">How it works</a>
    </nav>
    <div class="search-box"><input type="text" placeholder="Search lessons, papers, topics..."></div>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</div>

<div class="shell">
  <header class="subject-header" style="padding-bottom:0; border-bottom:none;">
    <div class="crumb">
      <a href="index.html">Subjects</a> &nbsp;/&nbsp;
      <a id="crumbSubject" href="#">—</a> &nbsp;/&nbsp;
      <span id="crumbLesson">—</span>
    </div>
    <h1 id="lessonTitle">Loading…</h1>
    <p id="lessonMeta" style="font-size:14px; color:var(--slate); margin-top:6px;"></p>
  </header>
</div>

<div class="quiz-shell">
  <div class="quiz-progress" id="quizProgress"></div>

  <div class="quiz-meta">
    <span class="quiz-source" id="quizSource"></span>
    <span class="quiz-counter" id="quizCounter"></span>
  </div>

  <div class="quiz-card" id="quizCard"></div>

  <div class="quiz-footer">
    <a href="#" class="btn btn-outline btn-sm" id="backLink">← Back to lesson list</a>
    <button class="btn btn-dark quiz-next" id="nextBtn">Next question →</button>
  </div>
</div>

<footer>
  <div class="shell">
    <div class="footer-inner">
      <a href="index.html" class="brand"><div class="brand-mark">EP</div>EduPrep</a>
      <div class="footer-links">
        <a href="subject.html?id=ict">ICT</a>
        <a href="subject.html?id=accounting">Accounting</a>
      </div>
    </div>
    <div class="footer-note">EduPrep Sri Lanka — built for O/L & A/L students</div>
  </div>
</footer>

<script src="data/content.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const subjectId = params.get('subject') || 'ict';
  const lessonId = params.get('lesson') || 'databases';

  const subject = SUBJECTS.find(s => s.id === subjectId) || SUBJECTS[0];
  const lesson = (LESSONS[subjectId] || []).find(l => l.id === lessonId);
  const questions = QUIZ_QUESTIONS[lessonId] || [];

  document.getElementById('crumbSubject').textContent = subject.short;
  document.getElementById('crumbSubject').href = `subject.html?id=${subjectId}`;
  document.getElementById('backLink').href = `subject.html?id=${subjectId}`;

  if (lesson) {
    document.title = `${lesson.title} — EduPrep Sri Lanka`;
    document.getElementById('crumbLesson').textContent = lesson.title;
    document.getElementById('lessonTitle').textContent = lesson.title;
    document.getElementById('lessonMeta').textContent = `${lesson.questionCount} questions across ${lesson.paperCount} past papers`;
  }

  let current = 0;
  let answered = false;

  function renderProgress(){
    const bar = document.getElementById('quizProgress');
    bar.innerHTML = '';
    questions.forEach((_, i) => {
      const seg = document.createElement('div');
      seg.className = 'quiz-progress-seg';
      if (i < current) seg.classList.add('done');
      if (i === current) seg.classList.add('current');
      bar.appendChild(seg);
    });
  }

  function renderQuestion(){
    answered = false;
    const q = questions[current];
    const card = document.getElementById('quizCard');

    document.getElementById('quizSource').textContent = q.sourcePaper;
    document.getElementById('quizCounter').textContent = `Question ${current + 1} of ${questions.length}`;
    document.getElementById('nextBtn').classList.remove('show');

    card.innerHTML = `
      <div class="quiz-question">${q.text}</div>
      <div class="quiz-options" id="optionsWrap"></div>
      <div class="quiz-explanations" id="explainWrap"></div>
    `;

    const wrap = document.getElementById('optionsWrap');
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.innerHTML = `<span class="opt-key">${opt.key}</span><span class="opt-text">${opt.text}</span>`;
      btn.addEventListener('click', () => selectOption(opt.key));
      wrap.appendChild(btn);
    });

    renderProgress();
  }

  function selectOption(chosenKey){
    if (answered) return;
    answered = true;
    const q = questions[current];

    document.querySelectorAll('.quiz-option').forEach((btn, i) => {
      const opt = q.options[i];
      btn.classList.add('locked');
      if (opt.correct) btn.classList.add('correct');
      else if (opt.key === chosenKey) btn.classList.add('incorrect');
    });

    const explainWrap = document.getElementById('explainWrap');
    explainWrap.innerHTML = '';
    q.options.forEach(opt => {
      const row = document.createElement('div');
      row.className = 'explain-row ' + (opt.correct ? 'is-correct' : 'is-incorrect');
      row.innerHTML = `<span class="explain-key">${opt.key}</span><span>${opt.explanation}</span>`;
      explainWrap.appendChild(row);
    });
    explainWrap.classList.add('show');

    if (current < questions.length - 1) {
      document.getElementById('nextBtn').classList.add('show');
    } else {
      document.getElementById('nextBtn').classList.remove('show');
    }
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
      window.scrollTo({top: document.querySelector('.quiz-shell').offsetTop - 80, behavior:'smooth'});
    }
  });

  if (questions.length === 0) {
    document.getElementById('quizCard').innerHTML = `
      <div class="empty-state">
        <h3>Questions coming soon for this lesson</h3>
        <p>This lesson is being built out — try the Database Management lesson in ICT for a working example.</p>
      </div>`;
    document.getElementById('quizProgress').style.display = 'none';
  } else {
    renderQuestion();
  }
</script>

</body>
</html>
