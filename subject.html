<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject — EduPrep Sri Lanka</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand"><div class="brand-mark">EP</div>EduPrep</a>
    <nav class="topnav">
      <a href="index.html">Subjects</a>
      <a href="index.html#how">How it works</a>
    </nav>
    <div class="search-box"><input type="text" placeholder="Search lessons, papers, topics..."></div>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</div>

<div class="shell">
  <header class="subject-header">
    <div class="crumb"><a href="index.html">Subjects</a> &nbsp;/&nbsp; <span id="crumbName">—</span></div>
    <h1 id="subjectName">Loading…</h1>
    <p id="subjectDesc"></p>
    <div class="subject-meta">
      <div class="meta-item"><div class="n" id="metaLessons">–</div><div class="l">Lessons</div></div>
      <div class="meta-item"><div class="n" id="metaPapers">–</div><div class="l">Past papers</div></div>
      <div class="meta-item"><div class="n" id="metaQuestions">–</div><div class="l">Questions</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="lessons">Lessons</div>
      <div class="tab" data-tab="papers">Past papers</div>
    </div>
  </header>

  <div id="lessonsPane">
    <div class="lesson-list" id="lessonList"></div>
  </div>

  <div id="papersPane" style="display:none;">
    <div class="paper-list" id="paperList"></div>
  </div>
</div>

<footer>
  <div class="shell">
    <div class="footer-inner">
      <a href="index.html" class="brand"><div class="brand-mark">EP</div>EduPrep</a>
      <div class="footer-links">
        <a href="subject.html?id=ict">ICT</a>
        <a href="subject.html?id=accounting">Accounting</a>
      </div>
    </div>
    <div class="footer-note">EduPrep Sri Lanka — built for O/L & A/L students</div>
  </div>
</footer>

<script src="data/content.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const subjectId = params.get('id') || 'ict';
  const subject = SUBJECTS.find(s => s.id === subjectId) || SUBJECTS[0];
  const lessons = LESSONS[subjectId] || [];
  const papers = PAPERS[subjectId] || [];

  document.title = `${subject.short} — EduPrep Sri Lanka`;
  document.getElementById('crumbName').textContent = subject.short;
  document.getElementById('subjectName').textContent = `${subject.level} ${subject.name}`;
  document.getElementById('subjectDesc').textContent = subject.description;
  document.getElementById('metaLessons').textContent = subject.lessonCount;
  document.getElementById('metaPapers').textContent = subject.paperCount;
  document.getElementById('metaQuestions').textContent = subject.questionCount;

  const lessonList = document.getElementById('lessonList');
  if (lessons.length === 0) {
    lessonList.outerHTML = `<div class="empty-state"><h3>Lessons coming soon</h3><p>This subject is being added — check back shortly.</p></div>`;
  } else {
    lessons.forEach(l => {
      const row = document.createElement('a');
      row.href = `lesson.html?subject=${subjectId}&lesson=${l.id}`;
      row.className = 'lesson-row';
      row.innerHTML = `
        <div class="lesson-num">${String(l.num).padStart(2,'0')}</div>
        <div class="lesson-title">${l.title}</div>
        <div class="lesson-counts">
          <span>${l.questionCount} questions</span>
          <span>${l.paperCount} papers</span>
        </div>
        <div class="lesson-arrow">→</div>
      `;
      lessonList.appendChild(row);
    });
  }

  const paperList = document.getElementById('paperList');
  if (papers.length === 0) {
    paperList.outerHTML = `<div class="empty-state"><h3>Papers coming soon</h3><p>Past papers for this subject are being added.</p></div>`;
  } else {
    papers.forEach(p => {
      const row = document.createElement('div');
      row.className = 'paper-row';
      row.innerHTML = `
        <div class="paper-year">${p.year}</div>
        <div class="paper-info">
          <div class="paper-title">${p.title}</div>
          <div class="paper-type">${p.type} · ${p.questionCount} questions</div>
        </div>
        ${p.hasReview ? '<div class="paper-badge">Review available</div>' : ''}
        <div class="paper-actions">
          <a href="${p.file || '#'}" target="_blank" class="btn btn-outline btn-sm">View paper</a>
          <a href="${p.file || '#'}" download class=btn btn outline btn-sm">Download</a>
        </div>
      `;
      paperList.appendChild(row);
    });
  }

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const which = tab.dataset.tab;
      document.getElementById('lessonsPane').style.display = which === 'lessons' ? 'block' : 'none';
      document.getElementById('papersPane').style.display = which === 'papers' ? 'block' : 'none';
    });
  });
</script>

</body>
</html>
